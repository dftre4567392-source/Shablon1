:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#342b34;background:#f8f3f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:620px;margin:auto;min-height:100dvh;padding:16px 16px 94px}.top{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px}.logo{font-weight:800;letter-spacing:2px;font-size:19px}.tiny{font-size:11px;color:#9e8b99;letter-spacing:1px}.circle{width:39px;height:39px;border-radius:50%;background:#eedbe7;display:grid;place-items:center;color:#7d5070;font-size:19px}.hero{position:relative;overflow:hidden;border-radius:25px;min-height:216px;background:linear-gradient(120deg,#4b3044,#8f5c79 60%,#d8b5c7);color:white;padding:25px 22px;box-shadow:0 12px 24px #b58ba547}.hero:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-35px;top:-55px;border:34px solid #ffffff1a}.hero:after{content:"";position:absolute;width:120px;height:120px;border-radius:60%;right:28px;bottom:-65px;background:#ffffff21}.hero h1{font-size:27px;line-height:1.14;letter-spacing:-.6px;margin:18px 0 11px;max-width:290px}.hero p{font-size:13px;max-width:260px;line-height:1.5;color:#f4eaf0}.kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#edd7e5}.section{margin:22px 0 12px;display:flex;justify-content:space-between;align-items:center}.section h2{font-size:19px;margin:0}.muted{color:#927e8d}.sub{font-size:13px;color:#8f808b;line-height:1.5}.btn{background:#513548;color:white;border:0;padding:14px 16px;border-radius:14px;font-weight:650;min-height:48px}.btn.soft{background:#f0dfe8;color:#63445a}.btn.line{background:white;border:1px solid #dac9d4;color:#5c4354}.btn.full{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:white;border:1px solid #f0e5ec;border-radius:18px;padding:16px;box-shadow:0 3px 12px #6e52650b}.service{margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.service.selected{border:1.5px solid #92627e;background:#f7e9f0}.tag{font-size:11px;background:#f2e4ec;color:#865d76;padding:6px 8px;border-radius:9px}.price{font-weight:700;white-space:nowrap}.serviceName{font-weight:650;font-size:14px}.chip{padding:10px 12px;border:1px solid #e7d5df;background:white;border-radius:12px;color:#5b4755}.chip.active{background:#4f3448;color:white;border-color:#4f3448}.flex{display:flex;gap:8px;flex-wrap:wrap}.field{width:100%;border-radius:13px;background:white;border:1px solid #dfd3da;padding:12px;margin:9px 0;color:#3f3440}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:620px;width:100%;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:#fffcfef2;display:flex;justify-content:space-around;border-top:1px solid #eddfeb;backdrop-filter:blur(18px)}.dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#988593;font-size:10px;flex:1;padding:6px 0}.dock button.active{color:#664158;font-weight:700}.dock .ico{font-size:22px}.empty{background:white;border:1px dashed #d7c2d0;text-align:center;padding:30px 15px;border-radius:18px;color:#867583}.notice{background:#fff8e7;border:1px solid #edd7a8;border-radius:14px;padding:12px;font-size:12px;color:#796448;line-height:1.5}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.item{background:white;border:1px solid #f0e5ec;padding:14px;border-radius:14px;margin:9px 0}.danger{color:#b1516b}.value{font-size:24px;font-weight:800;margin:9px 0 3px}.pill{border-radius:9px;padding:5px 8px;font-size:11px;background:#eaf5e9;color:#558159}.line{height:1px;background:#f0e6ec;margin:12px 0}h3{font-size:15px}.overlay{position:fixed;inset:0;background:#291a27aa;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fbf8fa;border-radius:23px;max-width:440px;width:100%;padding:24px}.error{color:#ad395c;font-size:12px;margin:6px 0}.ok{color:#4b8060}.cap{font-size:11px;color:#988b95}.hint{background:#f4e9f0;color:#795468;border-radius:13px;padding:12px;font-size:12px}.hide{display:none}.loading{opacity:.65;pointer-events:none}@media(min-width:600px){.wrap{padding-top:25px}.hero{min-height:230px}}@media(prefers-reduced-motion:no-preference){.card,.btn,.chip{transition:all .17s ease}.btn:active,.chip:active{transform:scale(.98)}}

</style></head><body><main class="wrap"><div class="top"><div><div class="logo">✦ BOOKCORE</div><div class="tiny">BEAUTY APPOINTMENTS</div></div><div class="circle">✿</div></div><div id="main"><div class="empty">Загружаем студию…</div></div></main><nav id="dock" class="dock"></nav><div id="modalRoot"></div><script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const initial=tg&&tg.initData||"";
const state={public:null,me:null,page:"home",serviceIds:[],date:"",time:"",slots:[],slotsLoading:false,slotsError:"",calendarMonth:"",bookingPending:false,bookings:[],master:null,loading:false,avatarUrl:null,avatarLoading:false};
const el=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=(x)=>new Intl.NumberFormat("ru-RU").format(x||0)+" ₽";
function fail(msg){alert(msg);}
async function api(path,opts){const target=new URL(path,location.origin);const dest=new URL("/api/handler",location.origin);dest.searchParams.set("route",target.pathname);target.searchParams.forEach((v,k)=>dest.searchParams.set(k,v));const r=await fetch(dest.toString(),{...opts,headers:{"content-type":"application/json","x-telegram-init-data":initial,...(opts&&opts.headers||{})}});const x=await r.json();if(!r.ok)throw new Error(x.error||"Ошибка сервера");return x;}
const isMaster=()=>state.me&&state.me.role==="master";
async function init(){try{state.public=await api("/api/public");if(/^#[0-9a-fA-F]{6}$/.test(state.public.accentColor||""))document.documentElement.style.setProperty("--bookcore-brand",state.public.accentColor);if(initial){try{state.me=await api("/api/me")}catch(e){console.error(e)}}}catch(e){state.public={studio:"Студия красоты",masterName:"Ваш мастер",services:[],ready:false}}if(isMaster())state.loading=true;render();if(isMaster())void loadMaster();if(initial&&!isMaster())void loadTelegramAvatar();if(state.me&&state.me.needsName)onboard();}
function route(p){
  state.page=p;
  if(isMaster()&&["calendar","clients","settings","overview"].includes(p)){
    state.loading=true;
    render();
    void loadMaster();
    return;
  }
  render();
  if(p==="visits")void loadBookings();
}
function nav(){const n=isMaster()?[["overview","⌂","Обзор"],["calendar","▦","Календарь"],["clients","♧","Клиенты"],["settings","⚙","Настройки"]]:[["home","⌂","Главная"],["booking","▦","Запись"],["visits","♡","Мои"],["profile","♙","Профиль"]];el("dock").innerHTML=n.map(x=>'<button class="'+(state.page===x[0]?"active":"")+'" onclick="route(\''+x[0]+'\')"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join("");}
function selectedServices(){
  return (state.public?.services||[]).filter(s=>state.serviceIds.includes(s.id));
}
function selectionTotal(){
  const list=selectedServices();
  return {count:list.length,minutes:list.reduce((sum,s)=>sum+s.minutes,0),price:list.reduce((sum,s)=>sum+s.price,0)};
}
function serviceCards(){
  const services=state.public?.services||[];
  return services.map(s=>{
    const active=state.serviceIds.includes(s.id);
    return '<div role="checkbox" aria-checked="'+active+'" tabindex="0" class="card service '+(active?"selected":"")+
      '" onclick="chooseService('+s.id+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();chooseService('+s.id+')}">'+
      '<div><div class="serviceName">'+esc(s.title)+'</div><div class="sub">'+esc(s.description||s.minutes+" мин")+
      '</div><div class="cap">'+s.minutes+' мин</div></div><div style="text-align:right"><div class="price">'+rub(s.price)+
      '</div><div class="service-check">'+(active?"✓":"＋")+'</div></div></div>';
  }).join("")||'<div class="empty">Услуги будут доступны после настройки сервера</div>';
}
function chooseService(id){
  const selected=state.serviceIds.includes(id);
  const next=selected?state.serviceIds.filter(x=>x!==id):[...state.serviceIds,id];
  if(next.length>6)return fail("Можно выбрать до 6 услуг в одной записи");
  const duration=(state.public?.services||[]).filter(x=>next.includes(x.id)).reduce((a,b)=>a+b.minutes,0);
  if(duration>600)return fail("Общая длительность превышает 10 часов. Выберите меньше услуг.");
  state.serviceIds=next;
  state.time="";state.slots=[];state.slotsError="";state.slotsLoading=false;
  render();
  if(state.date&&state.serviceIds.length)void loadSlots();
}
function studioToday(){
  const tz=state.public?.timezone||"Europe/Moscow";
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const v=Object.fromEntries(p.map(x=>[x.type,x.value]));
  return v.year+"-"+v.month+"-"+v.day;
}
function visibleDate(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return "";
  const d=new Date(date+"T12:00:00Z");
  return Number.isFinite(d.getTime())?new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"}).format(d):"";
}
function studioMaxDate(){
  const day=new Date(studioToday()+"T00:00:00Z");
  day.setUTCDate(day.getUTCDate()+45);
  return day.toISOString().slice(0,10);
}
function validCalendarDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value)))return false;
  const d=new Date(value+"T00:00:00Z");
  return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value&&value>=studioToday()&&value<=studioMaxDate();
}
function visibleMonth(){
  const initial=studioToday().slice(0,7)+"-01";
  if(!state.calendarMonth||!/^\d{4}-\d{2}-01$/.test(state.calendarMonth))state.calendarMonth=initial;
  if(state.calendarMonth<initial)state.calendarMonth=initial;
  if(state.calendarMonth>studioMaxDate().slice(0,7)+"-01")state.calendarMonth=studioMaxDate().slice(0,7)+"-01";
  return state.calendarMonth;
}
function changeMonth(delta){
  const current=new Date(visibleMonth()+"T00:00:00Z");
  current.setUTCMonth(current.getUTCMonth()+delta);
  const next=current.toISOString().slice(0,7)+"-01";
  if(next<studioToday().slice(0,7)+"-01"||next>studioMaxDate().slice(0,7)+"-01")return;
  state.calendarMonth=next;
  if(rescheduling)renderMoveCalendar();else render();
}
function calendarMarkup(mode="booking"){
  const month=visibleMonth();
  const view=new Date(month+"T00:00:00Z");
  const y=view.getUTCFullYear(),m=view.getUTCMonth();
  const offset=(view.getUTCDay()+6)%7;
  const length=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const previous=month>studioToday().slice(0,7)+"-01";
  const next=month<studioMaxDate().slice(0,7)+"-01";
  const title=new Intl.DateTimeFormat("ru-RU",{month:"long",timeZone:"UTC"}).format(view);
  const week=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(w=>'<span class="cal-weekday">'+w+'</span>').join("");
  let days="";
  for(let i=0;i<offset;i++)days+='<span class="cal-empty" aria-hidden="true"></span>';
  for(let day=1;day<=length;day++){
    const date=y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const enabled=validCalendarDate(date);
    const active=(mode==="move"?rescheduling?.date:state.date)===date;
    const today=date===studioToday();
    days+='<button type="button" class="cal-day'+(active?" chosen":"")+(today?" today":"")+'"'+
      (enabled?' onclick="'+(mode==="move"?"selectMoveDate":"selectDate")+'(\''+date+'\')"':' disabled')+
      ' aria-label="'+esc(date)+'" aria-pressed="'+active+'">'+day+'</button>';
  }
  return '<div class="book-calendar"><div class="cal-header"><button type="button" class="cal-nav" onclick="changeMonth(-1)"'+(previous?"":" disabled")+' aria-label="Предыдущий месяц">‹</button>'+
    '<b>'+esc(title.charAt(0).toUpperCase()+title.slice(1))+'</b>'+
    '<button type="button" class="cal-nav" onclick="changeMonth(1)"'+(next?"":" disabled")+' aria-label="Следующий месяц">›</button></div>'+
    '<div class="cal-grid">'+week+days+'</div><div class="cal-caption">Выберите день. Доступна запись на ближайшие 45 дней.</div></div>';
}
function slotsMarkup(){
  if(!state.serviceIds.length)return '<p class="cap">Сначала выберите одну или несколько услуг.</p>';
  if(!state.date)return '<p class="cap">Выберите дату в календаре.</p>';
  if(state.slotsLoading)return '<p class="cap">Проверяем свободное время…</p>';
  if(state.slotsError)return '<p class="error">'+esc(state.slotsError)+'</p>';
  return state.slots.length?state.slots.map(t=>'<button type="button" class="chip '+(state.time===t?"active":"")+
    '" onclick="selectTime(\''+t+'\')">'+t+'</button>').join(""):'<p class="cap">На этот день свободных окон нет. Выберите другой.</p>';
}
function homeBookingCard(){
  const master=esc(state.public.masterName||"Мастер");
  const studio=esc(state.public.studio||"Студия");
  return '<div class="section"><h2>Запись к мастеру</h2><span class="sub">'+master+'</span></div>'+
    '<div class="card" style="padding:18px"><div class="row" style="align-items:center;margin-bottom:18px"><div class="circle" style="flex-shrink:0">▦</div><div style="flex:1;min-width:0"><div class="serviceName">'+studio+'</div><div class="sub">Выберите услугу, затем удобную дату и время</div></div></div>'+
    '<button class="btn full" onclick="route(\'booking\')">Выбрать услугу и время →</button></div>'+
    '<div class="card" style="margin-top:13px"><h3 style="margin:0 0 12px">Как проходит запись</h3>'+
    '<div class="sub" style="margin-bottom:9px"><b style="color:#745168">01</b> &nbsp; Выберите услугу и посмотрите цену</div>'+
    '<div class="sub" style="margin-bottom:9px"><b style="color:#745168">02</b> &nbsp; Найдите свободное время в календаре</div>'+
    '<div class="sub"><b style="color:#745168">03</b> &nbsp; Подтвердите запись через Telegram</div></div>';
}
function profileAvatar(){
  return state.avatarUrl
    ? '<img class="telegram-avatar" src="'+esc(state.avatarUrl)+'" alt="Аватар из Telegram" />'
    : '♙';
}
async function loadTelegramAvatar(){
  if(state.avatarLoading||!initial)return;
  state.avatarLoading=true;
  try{
    const response=await fetch("/api/handler?route=%2Fapi%2Favatar",{
      headers:{"x-telegram-init-data":initial},
      cache:"no-store"
    });
    if(!response.ok||response.status===204)return;
    const avatar=await response.blob();
    if(!avatar.size||!avatar.type.startsWith("image/"))return;
    if(state.avatarUrl)URL.revokeObjectURL(state.avatarUrl);
    state.avatarUrl=URL.createObjectURL(avatar);
    if(state.page==="profile")render();
  }catch(error){
    console.warn("Telegram avatar unavailable",error);
  }finally{state.avatarLoading=false;}
}
function publicView(){if(state.page==="home")return '<div class="hero"><div class="kicker">ONLINE BOOKING</div><h1>Ваше время — ваш выбор</h1><p>Записывайтесь к мастеру на удобное время без звонков и переписок.</p><button class="btn soft" onclick="route(\'booking\')">Записаться →</button></div>'+homeBookingCard();
if(state.page==="booking"){
  const total=selectionTotal();
  const details=total.count?'<div class="booking-total"><b>Выбрано услуг: '+total.count+'</b><span>'+rub(total.price)+'</span></div>'+
    '<div class="sub">Общая длительность: '+total.minutes+' мин. На все услуги резервируется одно непрерывное время.</div>':'<div class="sub">Можно отметить несколько услуг — они будут объединены в одну запись.</div>';
  return '<div class="section"><h2>Выберите услуги</h2></div>'+
    '<div class="sub">Отметьте одну или несколько процедур. Сумма и время рассчитываются автоматически.</div>'+
    serviceCards()+ '<div class="card" style="margin-top:13px">'+details+'</div>'+
    '<div class="section"><h2>Дата и время</h2></div>'+
    '<div class="card"><div class="sub">Выберите свободную дату</div>'+calendarMarkup()+
    '<div class="sub" style="margin:15px 0 9px">Свободное время</div>'+
    '<div class="flex" id="slotList">'+slotsMarkup()+'</div></div>'+
    '<div class="card" style="margin-top:15px"><div class="row"><b>Итого</b><b>'+rub(total.price)+'</b></div>'+
    '<div class="sub" style="margin-top:8px">'+(state.date?'Дата: '+esc(visibleDate(state.date)):'Дата ещё не выбрана')+
    (state.time?', время: '+esc(state.time):'')+'</div>'+
    '<button type="button" class="btn full" style="margin-top:14px" '+
    (!total.count||!state.time||!initial||!state.public.ready||state.bookingPending?"disabled":"")+
    ' onclick="book()">'+(state.bookingPending?"Сохраняем запись…":"Подтвердить запись")+'</button>'+
    (!initial?'<div class="hint" style="margin-top:10px">Для записи откройте приложение через Telegram-бота.</div>':
      !state.public.ready?'<div class="hint" style="margin-top:10px">Онлайн-запись включится после подключения бота и мастера.</div>':'')+
    '</div>';
}
if(state.page==="visits")return '<div class="section"><h2>Мои записи</h2></div>'+(!initial?'<div class="empty">Откройте приложение в Telegram</div>':state.bookings.length?state.bookings.map(bookingCard).join(""):'<div class="empty">Пока нет записей<br><button style="margin-top:15px" class="btn" onclick="route(\'booking\')">Записаться</button></div>');
return '<div class="section"><h2>Мой профиль</h2></div><div class="card"><div class="row"><div class="circle profile-avatar">'+profileAvatar()+'</div><div style="flex:1"><b>'+esc(state.me&&state.me.clientName||"Гость")+'</b><div class="sub">Ваш профиль записи</div></div></div><div class="line"></div><button class="btn line full" onclick="onboard()">Изменить имя</button></div>';}
function bookingCard(b){
  const date=new Date(b.starts_at).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",timeZone:state.public?.timezone||"Europe/Moscow"});
  const quote=String.fromCharCode(39);
  const actions=b.status==="confirmed"?'<div class="flex"><button class="btn line" onclick="rescheduleForm('+quote+b.id+quote+','+JSON.stringify(b.service_ids||[b.service_id])+')">Перенести</button><button class="btn line" onclick="cancelBooking('+quote+b.id+quote+')">Отменить</button></div>':"";
  const customer=isMaster()?'<div class="sub" style="margin:7px 0">Клиент: '+esc(b.name||"Имя не указано")+'</div>':"";
  return '<div class="card" style="margin-bottom:10px"><div class="row"><b>'+esc(b.service_name)+'</b><span class="pill">'+esc(b.status)+'</span></div>'+customer+'<div class="sub" style="margin:9px 0">'+esc(date)+'</div><div class="row"><b>'+rub(b.price)+'</b>'+actions+'</div></div>';
}
function masterView(){if(state.loading)return '<div class="empty">Загружаем кабинет мастера…</div>';if(state.page==="overview"){const arr=state.master&&state.master.bookings||[];const recent=arr.filter(x=>x.status==="confirmed");return '<div class="section"><h2>Кабинет мастера</h2></div><div class="grid"><div class="card"><div class="sub">Активных записей</div><div class="value">'+recent.length+'</div></div><div class="card"><div class="sub">Всего клиентов</div><div class="value">'+(state.master&&state.master.clients||[]).length+'</div></div></div><div class="section"><h2>Ближайшие записи</h2></div>'+recent.slice(0,10).map(bookingCard).join("")+'<button class="btn full" onclick="route(\'calendar\')">Управлять календарём</button>';}
if(state.page==="calendar")return '<div class="section"><h2>Календарь мастера</h2></div><div class="card"><h3>Добавить запись вручную</h3><input id="manualName" class="field" placeholder="Имя клиента" maxlength="50"/><select id="manualService" class="field">'+state.public.services.map(s=>'<option value="'+s.id+'">'+esc(s.title)+'</option>').join("")+'</select><div class="grid"><input id="manualDate" type="date" class="field"/><input id="manualTime" type="time" class="field"/></div><button class="btn full" onclick="createManual()">Добавить запись</button></div><div class="card" style="margin-top:12px"><h3>Закрыть день или часы</h3><input id="blockDay" type="date" class="field"/><div class="grid"><input id="from" type="time" class="field" placeholder="От"/><input id="to" type="time" class="field" placeholder="До"/></div><input id="blockReason" class="field" placeholder="Причина (необязательно)"/><p class="cap">Оставьте время пустым, чтобы закрыть весь день.</p><button class="btn full" onclick="blockDay()">Заблокировать</button></div><div class="section"><h2>Блокировки</h2></div>'+(state.master&&state.master.blocks||[]).map(b=>'<div class="item row"><div><b>'+esc(b.day.slice(0,10))+'</b><div class="sub">'+(b.start_time?esc(b.start_time)+'–'+esc(b.end_time):"Весь день")+'</div></div><button class="btn line" onclick="unblock('+b.id+')">Открыть</button></div>').join("")+'<div class="section"><h2>Записи</h2></div>'+(state.master&&state.master.bookings||[]).map(b=>bookingCard(b)+'<div class="flex" style="margin-bottom:15px"><button class="chip" onclick="setStatus(\''+b.id+'\',\'completed\')">Выполнено</button><button class="chip" onclick="setStatus(\''+b.id+'\',\'no_show\')">Неявка</button></div>').join("");
if(state.page==="clients")return '<div class="section"><h2>Клиентская база</h2></div>'+(state.master&&state.master.clients||[]).map(u=>'<div class="item row"><div class="circle">♙</div><div style="flex:1"><b>'+esc(u.client_name||"Без имени")+'</b><div class="cap">Telegram ID: '+esc(u.telegram_id)+'</div></div></div>').join("")||'<div class="empty">Клиентов пока нет</div>';
return '<div class="section"><h2>Услуги и настройки</h2></div><div class="card"><h3>Добавить услугу</h3><input id="newServiceName" class="field" placeholder="Название услуги"/><div class="grid"><input id="newServiceMinutes" class="field" type="number" min="15" value="120" placeholder="Минут"/><input id="newServicePrice" class="field" type="number" min="0" value="1700" placeholder="Цена ₽"/></div><button class="btn full" onclick="createService()">Добавить</button></div><div class="section"><h2>Текущие услуги</h2></div>'+serviceCards()+'<div class="section"><h2>Изменить график</h2></div><div class="card"><select id="weekday" class="field"><option value="0">Понедельник</option><option value="1">Вторник</option><option value="2">Среда</option><option value="3">Четверг</option><option value="4">Пятница</option><option value="5">Суббота</option><option value="6">Воскресенье</option></select><div class="grid"><input id="workStart" type="time" class="field" value="10:00"/><input id="workEnd" type="time" class="field" value="19:00"/></div><label class="sub"><input id="workEnabled" type="checkbox" checked/> Рабочий день</label><button class="btn full" style="margin-top:12px" onclick="saveSchedule()">Сохранить график</button></div><div class="section"><h2>Рабочие дни</h2></div>'+(state.master&&state.master.schedule||[]).map(w=>'<div class="item row"><span>'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"][w.weekday]+'</span><span>'+esc(w.start_time)+'–'+esc(w.end_time)+'</span><span class="pill">'+(w.active?"Рабочий":"Выходной")+'</span></div>').join("");}
function render(){
  // Normalize initial screen after Telegram role verification.
  // A master must land on the dashboard, not the client home or settings fallback.
  if(isMaster()&&!["overview","calendar","clients","settings"].includes(state.page))state.page="overview";
  if(!isMaster()&&["overview","calendar","clients","settings"].includes(state.page))state.page="home";
  nav();
  el("main").innerHTML=isMaster()?masterView():publicView();
}
async function loadSlots(){
  const date=state.date,ids=[...state.serviceIds];
  if(!date||!ids.length){state.slots=[];state.slotsLoading=false;render();return;}
  const key=date+"|"+ids.join(",");
  state.slotsLoading=true;state.slotsError="";render();
  try{
    const res=await api("/api/slots?date="+encodeURIComponent(date)+"&services="+encodeURIComponent(ids.join(",")));
    if(state.date+"|"+state.serviceIds.join(",")!==key)return;
    state.slots=res.slots||[];
  }catch(error){
    if(state.date+"|"+state.serviceIds.join(",")!==key)return;
    state.slots=[];state.slotsError=error.message||"Не удалось загрузить свободное время.";
  }finally{
    if(state.date+"|"+state.serviceIds.join(",")===key){state.slotsLoading=false;render();}
  }
}
function selectDate(date){
  if(!validCalendarDate(date))return fail("Дата недоступна. Выберите день в пределах ближайших 45 дней.");
  state.date=date;state.calendarMonth=date.slice(0,7)+"-01";
  state.time="";state.slots=[];state.slotsError="";
  if(state.serviceIds.length)void loadSlots();else render();
}
function selectTime(time){if(!state.slots.includes(time))return;state.time=time;render();}
async function book(){
  if(state.bookingPending||!state.serviceIds.length||!validCalendarDate(state.date)||!state.slots.includes(state.time)){
    return fail("Выберите услуги, доступную дату и свободное время.");
  }
  state.bookingPending=true;render();
  try{
    await api("/api/book",{method:"POST",body:JSON.stringify({serviceIds:state.serviceIds,date:state.date,time:state.time})});
    state.time="";state.slots=[];state.date="";
    fail("Вы успешно записаны!");
    route("visits");
  }catch(error){fail("Не удалось записаться: "+error.message);if(state.date)void loadSlots();}
  finally{state.bookingPending=false;render();}
}
async function loadBookings(){try{state.bookings=(await api("/api/bookings")).bookings||[];render()}catch{}}
async function cancelBooking(id){if(!confirm("Отменить эту запись?"))return;try{await api("/api/cancel",{method:"POST",body:JSON.stringify({id})});loadBookings();loadMaster()}catch(e){fail(e.message)}}

async function createManual(){
  const body={name:el("manualName").value.trim(),serviceId:Number(el("manualService").value),date:el("manualDate").value,time:el("manualTime").value};
  try{await api("/api/manual-book",{method:"POST",body:JSON.stringify(body)});loadMaster();}
  catch(e){fail("Не удалось создать запись: "+e.message);}
}
async function saveSchedule(){
  const body={weekday:Number(el("weekday").value),start:el("workStart").value,end:el("workEnd").value,active:el("workEnabled").checked};
  try{await api("/api/schedule",{method:"POST",body:JSON.stringify(body)});loadMaster();}
  catch(e){fail("Не удалось сохранить график: "+e.message);}
}
let rescheduling=null;
function rescheduleForm(id,serviceIds){
  rescheduling={id,serviceIds,date:"",time:""};
  state.calendarMonth=studioToday().slice(0,7)+"-01";
  el("modalRoot").innerHTML='<div class="overlay"><div class="modal">'+
    '<h2>Перенос записи</h2><p class="sub">Выберите новую дату и свободное время.</p>'+
    '<div id="moveCalendar">'+calendarMarkup("move")+'</div><div id="moveSlots" class="flex" style="margin-top:13px"></div>'+
    '<div class="flex" style="margin-top:15px"><button class="btn" id="moveSave" disabled onclick="submitMove()">Сохранить перенос</button>'+
    '<button class="btn line" onclick="closeMoveModal()">Закрыть</button></div></div></div>';
}
function closeMoveModal(){rescheduling=null;el("modalRoot").innerHTML="";}
function renderMoveCalendar(){
  const target=el("moveCalendar");if(target&&rescheduling)target.innerHTML=calendarMarkup("move");
}
function selectMoveDate(date){
  if(!rescheduling||!validCalendarDate(date))return;
  rescheduling.date=date;rescheduling.time="";renderMoveCalendar();void loadMoveSlots(date);
}
async function loadMoveSlots(date){
  if(!rescheduling)return;
  rescheduling.date=date;rescheduling.time="";
  try{const r=await api("/api/slots?date="+encodeURIComponent(date)+"&services="+encodeURIComponent(rescheduling.serviceIds.join(",")));el("moveSlots").innerHTML=(r.slots||[]).map(t=>'<button class="chip" onclick="chooseMoveTime('+String.fromCharCode(39)+t+String.fromCharCode(39)+')">'+t+'</button>').join("")||'<p class="sub">Нет свободных окон</p>';el("moveSave").disabled=true;}
  catch(e){el("moveSlots").innerHTML='<p class="error">Не удалось загрузить время</p>';}
}
function chooseMoveTime(time){
  rescheduling.time=time;
  el("moveSave").disabled=false;
  Array.from(el("moveSlots").querySelectorAll(".chip")).forEach(b=>b.classList.toggle("active",b.textContent===time));
}
async function submitMove(){
  if(!rescheduling||!rescheduling.time)return;
  try{await api("/api/reschedule",{method:"POST",body:JSON.stringify({id:rescheduling.id,date:rescheduling.date,time:rescheduling.time})});closeMoveModal();if(isMaster())loadMaster();else loadBookings();}
  catch(e){fail("Не удалось перенести запись: "+e.message);}
}
let masterLoadSequence=0;
async function loadMaster(){
  if(!isMaster())return;
  const sequence=++masterLoadSequence;
  try{
    const result=await api("/api/master");
    if(sequence!==masterLoadSequence)return;
    state.master=result;
  }catch(error){
    if(sequence===masterLoadSequence)fail("Не удалось загрузить кабинет: "+error.message);
  }finally{
    if(sequence===masterLoadSequence){state.loading=false;render();}
  }
}
async function blockDay(){try{const day=el("blockDay").value, start=el("from").value,end=el("to").value;await api("/api/block",{method:"POST",body:JSON.stringify({day,startTime:start||null,endTime:end||null,reason:el("blockReason").value})});loadMaster()}catch(e){fail("Не удалось закрыть день: "+e.message)}}
async function unblock(id){try{await api("/api/unblock",{method:"POST",body:JSON.stringify({id})});loadMaster()}catch(e){fail(e.message)}}
async function setStatus(id,status){try{await api("/api/status",{method:"POST",body:JSON.stringify({id,status})});loadMaster()}catch(e){fail(e.message)}}
async function createService(){try{await api("/api/service",{method:"POST",body:JSON.stringify({title:el("newServiceName").value,minutes:Number(el("newServiceMinutes").value),price:Number(el("newServicePrice").value)})});state.public=await api("/api/public");loadMaster()}catch(e){fail(e.message)}}
function onboard(){if(!initial){fail("Откройте приложение через Telegram-бота");return;}el("modalRoot").innerHTML='<div class="overlay"><div class="modal"><div style="font-size:34px;text-align:center">✿</div><h2 style="text-align:center">Давайте знакомиться!</h2><p class="sub" style="text-align:center">Укажите ваше настоящее имя, чтобы мастер знал, кого ожидать на процедуре.</p><input class="field" id="newName" maxlength="50" placeholder="Например, Анастасия"/><button class="btn full" onclick="saveName()">Продолжить</button><p class="cap" style="text-align:center">Без паспортов и данных банковских карт</p></div></div>';}
async function saveName(){const name=el("newName").value.trim();if(name.length<2)return fail("Введите имя, не менее двух символов");try{await api("/api/name",{method:"POST",body:JSON.stringify({name})});state.me.clientName=name;state.me.needsName=false;el("modalRoot").innerHTML="";render()}catch(e){fail(e.message)}}
init();
</script></body></html>
