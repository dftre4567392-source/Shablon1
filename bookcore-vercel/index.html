  const tz=state.public?.timezone||"Europe/Moscow";
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const v=Object.fromEntries(p.map(x=>[x.type,x.value]));
  return v.year+"-"+v.month+"-"+v.day;
}
function visibleDate(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return "";
  const d=new Date(date+"T12:00:00Z");
  return Number.isFinite(d.getTime())?new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"}).format(d):"";
}
function bookingRangeBounds(){
  const preview=isMaster()&&[7,14,30,45].includes(Number(state.masterWindowPreview))?Number(state.masterWindowPreview):null;
  const days=preview||([7,14,30,45].includes(Number(state.public?.bookingWindowDays))?Number(state.public.bookingWindowDays):30);
  const today=studioToday();
  const configured=preview?null:state.public?.bookingWindowAnchor;
  const anchored=typeof configured==="string"&&/^\\d{4}-\\d{2}-\\d{2}$/.test(configured)&&configured<=today;
  const anchor=anchored?configured:today;
  const elapsed=Math.floor((Date.parse(today+"T00:00:00Z")-Date.parse(anchor+"T00:00:00Z"))/86400000);
  const first=new Date(anchor+"T00:00:00Z");
  first.setUTCDate(first.getUTCDate()+Math.floor(Math.max(0,elapsed)/days)*days);
  const last=new Date(first);
  last.setUTCDate(last.getUTCDate()+days-(anchored?1:0));
  return {start:first.toISOString().slice(0,10),end:last.toISOString().slice(0,10),days};
}
function studioMaxDate(){return bookingRangeBounds().end;}
function validCalendarDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value)))return false;
  const d=new Date(value+"T00:00:00Z");
  return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value&&value>=studioToday()&&value<=studioMaxDate();
}
function visibleMonth(){
  const initial=studioToday().slice(0,7)+"-01";
  if(!state.calendarMonth||!/^\d{4}-\d{2}-01$/.test(state.calendarMonth))state.calendarMonth=initial;
  if(state.calendarMonth<initial)state.calendarMonth=initial;
  if(state.calendarMonth>studioMaxDate().slice(0,7)+"-01")state.calendarMonth=studioMaxDate().slice(0,7)+"-01";
  return state.calendarMonth;
}
function changeMonth(delta){
  const current=new Date(visibleMonth()+"T00:00:00Z");
  current.setUTCMonth(current.getUTCMonth()+delta);
  const next=current.toISOString().slice(0,7)+"-01";
  if(next<studioToday().slice(0,7)+"-01"||next>studioMaxDate().slice(0,7)+"-01")return;
  state.calendarMonth=next;
  if(rescheduling){renderMoveCalendar();void loadCalendarInfo();}else{render();void loadAvailability();}
}

async function loadCalendarInfo({quiet=false}={}){
  if(isMaster()||state.page!=="booking"&&!rescheduling)return;
  const month=visibleMonth().slice(0,7);
  const ids=rescheduling?rescheduling.serviceIds:state.serviceIds;
  const key=month+"|"+ids.join(",");
  const request=++state.calendarRequest;
  if(!quiet)state.calendarInfo=null;
  try{
    const result=await api("/api/calendar?month="+encodeURIComponent(month)+"&services="+encodeURIComponent(ids.join(",")));
    if(request!==state.calendarRequest)return;
    const days=result.days||{};
    const old=state.calendarInfo;
    const changed=!old||old.key!==key||JSON.stringify(old.days)!==JSON.stringify(days);
    state.calendarInfo={key,days};
    if(changed){
      if(rescheduling)renderMoveCalendar();
      else if(state.page==="booking")render();
    }
  }catch(error){
    if(request===state.calendarRequest)console.warn("BOOKCORE_CALENDAR_STATUS_FAILED",error);
  }
}
function calendarMarkup(mode="booking"){
  const month=visibleMonth();
  const view=new Date(month+"T00:00:00Z");
  const y=view.getUTCFullYear(),m=view.getUTCMonth();
  const offset=(view.getUTCDay()+6)%7;
  const length=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const previous=month>studioToday().slice(0,7)+"-01";
  const next=month<studioMaxDate().slice(0,7)+"-01";
  const title=new Intl.DateTimeFormat("ru-RU",{month:"long",timeZone:"UTC"}).format(view);
  const week=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(w=>'<span class="cal-weekday">'+w+'</span>').join("");
  let days="";
  for(let i=0;i<offset;i++)days+='<span class="cal-empty" aria-hidden="true"></span>';
  for(let day=1;day<=length;day++){
    const date=y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const enabled=validCalendarDate(date);
    const inRange=date>=studioToday()&&date<=studioMaxDate();
    const rangeClass=inRange?" range-open":" range-closed";
    const active=(mode==="move"?rescheduling?.date:state.date)===date;
    const today=date===studioToday();
    const calendar=state.calendarInfo;
    const expected=month.slice(0,7)+"|"+(mode==="move"&&rescheduling?rescheduling.serviceIds:state.serviceIds).join(",");
    const item=calendar?.key===expected?calendar.days[date]:null;
    const status=item?.status||"";
    const blocked=status==="off";
    const symbols={off:"×",short:"◐",busy:"•",available:"✓"};
    const valid=enabled&&!blocked;
    days+='<button type="button" class="cal-day'+(status?" state-"+status:"")+rangeClass+(active?" chosen":"")+(today?" today":"")+'"'+
      (valid?' onclick="'+(mode==="move"?"selectMoveDate":"selectDate")+'(\''+date+'\')"':' disabled')+
      ' aria-label="'+esc(date+(item?" — "+item.label:""))+'" title="'+esc(item?.label||"")+'" aria-pressed="'+active+'">'+day+
      (status?'<span aria-hidden="true" class="cal-symbol">'+symbols[status]+'</span>':"")+'</button>';
  }
  return '<div class="book-calendar"><div class="cal-header"><button type="button" class="cal-nav" onclick="changeMonth(-1)"'+(previous?"":" disabled")+' aria-label="Предыдущий месяц">‹</button>'+
    '<b>'+esc(title.charAt(0).toUpperCase()+title.slice(1))+'</b>'+
    '<button type="button" class="cal-nav" onclick="changeMonth(1)"'+(next?"":" disabled")+' aria-label="Следующий месяц">›</button></div>'+
    '<div class="cal-grid">'+week+days+'</div>'+
    '<div class="calendar-legend"><span class="legend-item"><i class="legend-dot available"></i>Свободно</span><span class="legend-item"><i class="legend-dot short"></i>Сокращённый</span><span class="legend-item"><i class="legend-dot busy"></i>Мест нет</span><span class="legend-item"><i class="legend-dot off"></i>Выходной</span></div>'+
    '<div class="cal-caption">Расписание устанавливает мастер. Запись открыта на '+esc(state.public?.bookingWindowDays||30)+' дней вперёд.</div></div>';
}

async function photoAsJpeg(file){
  if(!file||!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type||""))throw new Error("Выберите фотографию JPEG, PNG, WebP или HEIC.");
  if(file.size>25*1024*1024)throw new Error("Исходная фотография слишком большая (максимум 25 МБ).");
  let image,objectUrl;
  try{
    objectUrl=URL.createObjectURL(file);
    image=await new Promise((resolve,reject)=>{
      const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("Не удалось открыть фото. Используйте JPEG, PNG или WebP."));
      img.src=objectUrl;
    });
    const canvas=document.createElement("canvas"),max=1600;
    const factor=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));
    canvas.width=Math.max(1,Math.round(image.naturalWidth*factor));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*factor));
    const context=canvas.getContext("2d");if(!context)throw new Error("Обработка фотографий недоступна.");
    context.fillStyle="#ffffff";context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    let blob;
    for(const quality of [0.85,0.7,0.55]){
      blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));
      if(blob&&blob.size<=2_000_000)break;
    }
    if(!blob||blob.size>2_000_000)throw new Error("Не удалось уменьшить фотографию до допустимого размера.");
    const bytes=new Uint8Array(await blob.arrayBuffer());
    let binary="";
    for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
    return {mime:"image/jpeg",data:btoa(binary)};
  }finally{if(objectUrl)URL.revokeObjectURL(objectUrl);}
}

async function loadMasterCalendar({quiet=false}={}){

   const changed=JSON.stringify(state.masterCalendar)!==JSON.stringify(incoming);

     state.public.bookingWindowDays=data.windowDays||state.public.bookingWindowDays;

   }
 }catch(error){
   console.warn("BOOKCORE_MASTER_CALENDAR_FAILED",error);

 }

  const openPanels=new Set(previousPanels.filter(x=>x.open).map(x=>x.dataset.panel));
  const keepFields=masterCalendar&&oldDay===state.masterDate;
  const preserved=keepFields?Object.fromEntries(["manualName","blockReason","from","to","masterDayStart","masterDayEnd"].map(id=>[id,root.querySelector?.("#"+id)?.value])):{};

// One coherent server snapshot for the calendar and the selected day's slots.
async function loadAvailability({quiet=false}={}){
  if(isMaster()||state.page!=="booking"||rescheduling)return;
  if(quiet&&state.availabilityBusy)return;
  const month=visibleMonth().slice(0,7),ids=[...state.serviceIds],date=ids.length?state.date:"";
  const key=month+"|"+ids.join(","),selection=date+"|"+ids.join(",");
  const request=++state.availabilityRequest;
  state.availabilityBusy=true;
  if(!quiet){state.slotsLoading=!!date;state.slotsError="";render();}
  try{
    const params=new URLSearchParams({month,services:ids.join(",")});
    if(date)params.set("date",date);
    const response=await api("/api/availability?"+params.toString());
    if(request!==state.availabilityRequest||state.page!=="booking"||
      visibleMonth().slice(0,7)+"|"+state.serviceIds.join(",")!==key||
      (state.serviceIds.length?state.date:"")+"|"+state.serviceIds.join(",")!==selection)return;
    const previousRange=bookingRangeBounds().end;
    if(state.public){
      if([7,14,30,45].includes(Number(response.bookingWindowDays)))state.public.bookingWindowDays=Number(response.bookingWindowDays);
      state.public.bookingWindowAnchor=response.bookingWindowAnchor||null;
    }
    const changedRange=previousRange!==bookingRangeBounds().end;
    if(changedRange&&state.date&&!validCalendarDate(state.date)){
      state.date="";state.time="";state.slots=[];state.availabilityAlert="Период записи обновился. Выберите новую дату.";
    }
    const oldSlots=state.slots;
    const nextSlots=state.date?response.slots||[]:[];
    const changed=JSON.stringify(nextSlots)!==JSON.stringify(oldSlots);
    const previousAlert=state.availabilityAlert;
    const taken=!!state.time&&!nextSlots.includes(state.time);
    const previousCalendar=state.calendarInfo;
    const days=response.days||{};
    const calendarChanged=!previousCalendar||previousCalendar.key!==key||
      JSON.stringify(previousCalendar.days)!==JSON.stringify(days);
    state.calendarInfo={key,days};
    state.slots=nextSlots;
    state.slotsError="";
    state.slotsLoading=false;
    state.availabilityUpdatedAt=Date.now();
    if(taken){
      state.time="";
      state.availabilityAlert="Выбранное время занято. Выберите другое окно.";
    }else{
      state.availabilityAlert="";
    }
    if(!quiet||taken||changedRange){
      // Full rendering is necessary only on explicit selection or when a selected
      // slot was invalidated; keep the user's scroll position intact.
      const position=window.scrollY;
      render();
      if(quiet&&taken)window.scrollTo(0,position);
    }else{
      // Avoid re-creating the whole page every few seconds on mobile Telegram.
      if(changed||previousAlert!==state.availabilityAlert){
        const list=el("slotList");
        if(list)list.innerHTML=slotsMarkup();
      }
      if(calendarChanged){
        const calendar=el("bookingCalendar");
        if(calendar)calendar.innerHTML=calendarMarkup();
      }
    }
  }catch(error){
    if(request!==state.availabilityRequest)return;
    if(!quiet){
      state.slotsError=error.message||"Не удалось обновить расписание.";
      state.slotsLoading=false;
      render();
    }else{
      console.warn("BOOKCORE_AVAILABILITY_REFRESH_FAILED",String(error));
    }
  }finally{
    if(request===state.availabilityRequest){
      state.availabilityBusy=false;
      state.slotsLoading=false;
    }
  }
}

      '<div class="modal-head"><h2>Отмена записи</h2><p class="sub">Вы отменяете: '+esc(label)+'. Клиент получит сообщение с объяснением.</p></div>'+
      '<div class="modal-scroll"><label class="cap" for="masterCancelReason">Почему нужно отменить?</label>'+
      '<textarea class="field" id="masterCancelReason" rows="4" maxlength="300" placeholder="Например: мастер заболел, предлагаем выбрать другую дату"></textarea>'+
      '<p class="cap">Укажите понятную причину (не менее 8 символов).</p></div>'+
      '<div class="modal-actions"><button class="btn line" onclick="closeMasterCancel()">Оставить запись</button>'+
      '<button class="btn" onclick="submitMasterCancel(\''+esc(id)+'\')">Подтвердить отмену</button></div></div></div>';
    return;
  }
  if(!confirm("Отменить запись? Вы сможете вернуть то же время в течение пяти минут."))return;
  try{await api("/api/cancel",{method:"POST",body:JSON.stringify({id})});await loadBookings();}
  catch(e){fail(e.message)}
}
function closeMasterCancel(){el("modalRoot").innerHTML="";}
async function submitMasterCancel(id){
 const reason=el("masterCancelReason")?.value.trim()||"";
 if(reason.length<8)return fail("Опишите причину отмены подробнее — хотя бы 8 символов.");
 try{
  await api("/api/cancel",{method:"POST",body:JSON.stringify({id,reason})});
  closeMasterCancel();await loadMaster();fail("Запись отменена. Причина сохранена, клиенту отправлено уведомление.");
 }catch(e){fail("Не удалось отменить: "+e.message)}
}

async function createManual(){
  const body={name:el("manualName").value.trim(),serviceId:Number(el("manualService").value),date:state.masterDate,time:state.masterTime};
  if(!body.time||!state.masterSlots.includes(body.time))return fail("Сначала выберите свободное время в календаре.");
  try{await api("/api/manual-book",{method:"POST",body:JSON.stringify(body)});loadMaster();}
  catch(e){fail("Не удалось создать запись: "+e.message);}
}
async function saveSchedule(){
  const body={weekday:Number(el("weekday").value),start:el("workStart").value,end:el("workEnd").value,active:el("workEnabled").checked};
  try{await api("/api/schedule",{method:"POST",body:JSON.stringify(body)});loadMaster();}
  catch(e){fail("Не удалось сохранить график: "+e.message);}
}
let rescheduling=null;
let moveRequestSequence=0;
function rescheduleForm(id,serviceIds){
  moveRequestSequence++;
  rescheduling={id,serviceIds,date:"",time:""};
  state.calendarMonth=studioToday().slice(0,7)+"-01";
  void loadCalendarInfo();
  el("modalRoot").innerHTML='<div class="overlay" id="moveOverlay" onclick="if(event.target===this)closeMoveModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="Перенос записи">'+
    '<div class="modal-head"><h2>Перенос записи</h2><p class="sub">Выберите новую дату и свободное время.</p></div>'+
    '<div class="modal-scroll" id="moveScroll"><div id="moveCalendar">'+calendarMarkup("move")+'</div><div class="sub" style="margin:12px 0 8px">Доступное время</div><div id="moveSlots" class="flex" style="margin-top:8px"></div></div>'+
    '<div class="modal-actions"><button class="btn line" onclick="closeMoveModal()">Закрыть</button><button class="btn" id="moveSave" disabled onclick="submitMove()">Сохранить перенос</button></div></div></div>';
}
function closeMoveModal(){moveRequestSequence++;rescheduling=null;el("modalRoot").innerHTML="";}
function renderMoveCalendar(){
  const target=el("moveCalendar");if(target&&rescheduling)target.innerHTML=calendarMarkup("move");
}
function selectMoveDate(date){
  if(!rescheduling||!validCalendarDate(date)||state.calendarInfo?.days?.[date]?.status==="off")return;
  rescheduling.date=date;rescheduling.time="";renderMoveCalendar();void loadMoveSlots(date);
}
async function loadMoveSlots(date){
  const current=rescheduling;
  if(!current)return;
  const request=++moveRequestSequence;
  current.date=date;current.time="";current.availableSlots=[];
  const initialSlots=el("moveSlots"),initialSave=el("moveSave");
  if(initialSlots)initialSlots.innerHTML='<p class="sub">Проверяем свободное время…</p>';
  if(initialSave)initialSave.disabled=true;
  const valid=()=>rescheduling===current&&request===moveRequestSequence&&current.date===date;
  try{
    const response=await api("/api/slots?date="+encodeURIComponent(date)+"&services="+encodeURIComponent(current.serviceIds.join(",")));
    if(!valid())return;
    const slotsElement=el("moveSlots"),save=el("moveSave");
    if(!slotsElement||!save)return;
    current.availableSlots=response.slots||[];
    slotsElement.innerHTML=current.availableSlots.map(t=>'<button class="chip" onclick="chooseMoveTime('+String.fromCharCode(39)+t+String.fromCharCode(39)+')">'+t+'</button>').join("")||'<p class="sub">Нет свободных окон</p>';
    save.disabled=true;
    // Show the available times without covering the bottom action bar.
    const container=el("moveScroll");
    if(container&&window.matchMedia("(max-height: 700px)").matches)container.scrollTop=Math.min(container.scrollHeight,container.scrollTop+70);
  }catch(error){
    if(!valid())return;
    const slotsElement=el("moveSlots");
    if(slotsElement)slotsElement.innerHTML='<p class="error">Не удалось загрузить время. Выберите дату ещё раз.</p>';
  }
}
function chooseMoveTime(time){
  if(!rescheduling||!rescheduling.availableSlots?.includes(time))return;
  rescheduling.time=time;
  const save=el("moveSave");if(save)save.disabled=false;
  const slotsElement=el("moveSlots");
  if(slotsElement)Array.from(slotsElement.querySelectorAll(".chip")).forEach(b=>b.classList.toggle("active",b.textContent===time));
}
async function submitMove(){
  if(!rescheduling||!rescheduling.time)return;
  try{await api("/api/reschedule",{method:"POST",body:JSON.stringify({id:rescheduling.id,date:rescheduling.date,time:rescheduling.time})});closeMoveModal();if(isMaster())loadMaster();else loadBookings();}
  catch(e){fail("Не удалось перенести запись: "+e.message);}
}
let masterLoadSequence=0;
async function loadMaster(){
  if(!isMaster())return;
  const sequence=++masterLoadSequence;
  try{
    const result=await api("/api/master");
    if(sequence!==masterLoadSequence)return;
    state.master=result;
    if(!state.masterMonth)state.masterMonth=studioToday().slice(0,7);
    if(!state.masterDate)state.masterDate=studioToday();
    if(state.public){
      state.public.bookingWindowDays=result.bookingWindowDays||30;
      state.public.bookingWindowAnchor=result.bookingWindowAnchor||null;
    }
  }catch(error){
    if(sequence===masterLoadSequence)fail("Не удалось загрузить кабинет: "+error.message);
  }finally{
    if(sequence===masterLoadSequence){state.loading=false;render();if(state.page==="calendar"){void loadMasterCalendar();void loadMasterSlots();}}
  }
}
async function blockDay(){try{const day=state.masterDate, start=el("from").value,end=el("to").value;if(!start||!end)return fail("Укажите начало и конец перерыва. Для выходного используйте настройку дня.");await api("/api/block",{method:"POST",body:JSON.stringify({day,startTime:start||null,endTime:end||null,reason:el("blockReason").value})});loadMaster()}catch(e){fail("Не удалось закрыть день: "+e.message)}}
async function unblock(id){try{await api("/api/unblock",{method:"POST",body:JSON.stringify({id})});loadMaster()}catch(e){fail(e.message)}}
async function setStatus(id,status){try{await api("/api/status",{method:"POST",body:JSON.stringify({id,status})});loadMaster()}catch(e){fail(e.message)}}
async function createService(){
 const name=el("newServiceName").value.trim(),description=el("newServiceDescription")?.value||"",
   details=el("newServiceDetails")?.value||"",links=photoUrlsFromInput("newServicePhotos"),
   files=Array.from(el("newServiceFile")?.files||[]),
   minutes=Number(el("newServiceMinutes").value),price=Number(el("newServicePrice").value);
 if(files.length+links.length>5)return fail("Для одной услуги можно выбрать не более пяти фотографий.");
 const status=el("newServiceStatus"),button=el("newServiceFile");
 if(button)button.disabled=true;
 try{
   if(status)status.textContent="Создаём услугу…";
   const created=await api("/api/service",{method:"POST",body:JSON.stringify({title:name,description,details,photos:links,minutes,price})});
   if(files.length){
     for(let i=0;i<files.length;i++){
       if(status)status.textContent="Загружаем фото "+(i+1)+" из "+files.length+"…";
       links.push(await uploadManagedPhoto(files[i]));
     }
     if(status)status.textContent="Добавляем фотографии в услугу…";
     await api("/api/service",{method:"POST",body:JSON.stringify({id:created.id,title:name,description,details,photos:links,minutes,price})});
   }
   state.public=await api("/api/public");await loadMaster();fail("Услуга создана.");
 }catch(e){if(status)status.textContent="Не удалось завершить: "+e.message;fail("Ошибка создания услуги: "+e.message)}
 finally{if(button)button.disabled=false;}
}
function onboard(){if(!initial){fail("Откройте приложение через Telegram-бота");return;}el("modalRoot").innerHTML='<div class="overlay"><div class="modal"><div style="font-size:34px;text-align:center">✿</div><h2 style="text-align:center">Давайте знакомиться!</h2><p class="sub" style="text-align:center">Укажите ваше настоящее имя, чтобы мастер знал, кого ожидать на процедуре.</p><input class="field" id="newName" maxlength="50" placeholder="Например, Анастасия"/><button class="btn full" onclick="saveName()">Продолжить</button><p class="cap" style="text-align:center">Без паспортов и данных банковских карт</p></div></div>';}
async function saveName(){const name=el("newName").value.trim();if(name.length<2)return fail("Введите имя, не менее двух символов");try{await api("/api/name",{method:"POST",body:JSON.stringify({name})});state.me.clientName=name;state.me.needsName=false;el("modalRoot").innerHTML="";render()}catch(e){fail(e.message)}}
// Local day-boundary checks are cheap; network checks are throttled and only run while visible.
let lastObservedStudioDay="",lastMasterSyncAt=0,liveMasterSyncBusy=false;
async function liveCalendarTick(force=false){
  if(document.visibilityState==="hidden"||!state.public)return;
  const today=studioToday();
  const newDay=lastObservedStudioDay&&lastObservedStudioDay!==today;
  lastObservedStudioDay=today;
  if(newDay){
    if(isMaster()&&state.page==="calendar"&&state.masterDate<today){
      state.masterDate=today;state.masterMonth=today.slice(0,7);
    }
    if(!isMaster()&&state.date&&!validCalendarDate(state.date)){
      state.date="";state.time="";state.slots=[];
    }
    render();
  }
  if(isMaster()&&state.page==="calendar"&&!state.loading){
    if(!force&&!newDay&&Date.now()-lastMasterSyncAt<12000)return;
    if(liveMasterSyncBusy)return;
    liveMasterSyncBusy=true;lastMasterSyncAt=Date.now();
    try{
      const incoming=await api("/api/master");
      if(state.page!=="calendar")return;
      const relevant=x=>JSON.stringify({
        bookings:x?.bookings,blocks:x?.blocks,services:x?.services,
        schedule:x?.schedule,bookingWindowDays:x?.bookingWindowDays,
        bookingWindowAnchor:x?.bookingWindowAnchor
      });
      const changed=relevant(incoming)!==relevant(state.master);
      if(changed){
        state.master=incoming;
        state.public.bookingWindowDays=incoming.bookingWindowDays||state.public.bookingWindowDays;
        state.public.bookingWindowAnchor=incoming.bookingWindowAnchor||null;
        render();
        void loadMasterSlots();
      }
      await loadMasterCalendar({quiet:true});
    }catch(error){console.warn("BOOKCORE_LIVE_MASTER_REFRESH_FAILED",String(error));}
    finally{liveMasterSyncBusy=false;}
  }else if(!isMaster()&&state.page==="booking"&&(force||newDay)){
    await refreshAvailability();
  }
}
setInterval(updateRestoreCountdowns,1000);
setInterval(()=>{void refreshAvailability()},11000+Math.floor(Math.random()*4000));
setInterval(()=>{void liveCalendarTick()},3000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")void liveCalendarTick(true);});
window.addEventListener("focus",()=>{void liveCalendarTick(true);});
init();
</script></body></html>
