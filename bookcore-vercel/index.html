const tg=window.Telegram&&window.Telegram.WebApp;

const initial=tg&&tg.initData||"";
const state={public:null,me:null,page:"home",serviceIds:[],date:"",time:"",slots:[],slotsLoading:false,slotsError:"",calendarMonth:"",bookingPending:false,bookings:[],master:null,loading:false,avatarUrl:null,avatarLoading:false,notificationPrefs:null,notificationSaving:false,waitlist:[],calendarInfo:null,calendarRequest:0,slotsRequest:0,availabilityUpdatedAt:0,availabilityAlert:"",availabilityRequest:0,availabilityBusy:false};

const API_ERROR_TEXT={

};
function humanApiError(error){
  if(API_ERROR_TEXT[error])return API_ERROR_TEXT[error];
  if(typeof error==="string"&&!/^[A-Z][A-Z0-9_]*$/.test(error))return error;
  return "Не удалось выполнить действие. Попробуйте ещё раз.";
}
async function api(path,opts){const target=new URL(path,location.origin);const dest=new URL("/api/handler",location.origin);dest.searchParams.set("route",target.pathname);target.searchParams.forEach((v,k)=>dest.searchParams.set(k,v));const r=await fetch(dest.toString(),{cache:"no-store",...opts,headers:{"content-type":"application/json","x-telegram-init-data":initial,...(opts&&opts.headers||{})}});const x=await r.json().catch(()=>null);if(x===null)throw new Error("Сервер временно недоступен. Попробуйте ещё раз.");if(!r.ok)throw new Error(humanApiError(x.error));return x;}
const isMaster=()=>state.me&&state.me.role==="master";
async function init(){try{state.public=await api("/api/public");if(/^#[0-9a-fA-F]{6}$/.test(state.public.accentColor||""))document.documentElement.style.setProperty("--bookcore-brand",state.public.accentColor);if(initial){try{state.me=await api("/api/me")}catch(e){console.error(e)}}}catch(e){state.public={studio:"Студия красоты",masterName:"Ваш мастер",services:[],ready:false}}if(isMaster())state.loading=true;render();if(isMaster())void loadMaster();if(initial&&!isMaster())void loadTelegramAvatar();if(state.me&&state.me.needsName)onboard();}
function route(p){
  state.page=p;
  if(isMaster()&&["calendar","clients","analytics","settings","overview"].includes(p)){
    state.loading=true;
    render();
    void loadMaster();
    return;
  }
  render();
  if(p==="visits")void loadBookings();
  if(p==="booking"){void loadWaitlist();void loadAvailability();}

}
function nav(){const n=isMaster()?[["overview","⌂","Главная"],["calendar","▦","Записи"],["clients","♧","Клиенты"],["analytics","▥","Отчёты"],["settings","⚙","Услуги"]]:[["home","⌂","Главная"],["booking","▦","Запись"],["visits","♡","Мои"],["profile","♙","Профиль"]];el("dock").innerHTML=n.map(x=>'<button class="'+(state.page===x[0]?"active":"")+'" onclick="route(\''+x[0]+'\')"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join("");}
function selectedServices(){
  return (state.public?.services||[]).filter(s=>state.serviceIds.includes(s.id));
}
function selectionTotal(){
  const list=selectedServices();
  return {count:list.length,minutes:list.reduce((sum,s)=>sum+s.minutes,0),price:list.reduce((sum,s)=>sum+s.price,0)};
}
function serviceCards(){
  const services=state.public?.services||[];
  return services.map(s=>{
    const active=state.serviceIds.includes(s.id);
    return '<div role="checkbox" aria-checked="'+active+'" tabindex="0" class="card service '+(active?"selected":"")+
      '" onclick="chooseService('+s.id+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();chooseService('+s.id+')}">'+
      '<div><div class="serviceName">'+esc(s.title)+'</div><div class="sub">'+esc(s.description||s.minutes+" мин")+
      '</div><div class="cap">'+s.minutes+' мин</div></div><div style="text-align:right"><div class="price">'+rub(s.price)+
      '</div><div class="service-check">'+(active?"✓":"＋")+'</div></div></div>';
  }).join("")||'<div class="empty">Услуги будут доступны после настройки сервера</div>';
}
function chooseService(id){
  const selected=state.serviceIds.includes(id);
  const next=selected?state.serviceIds.filter(x=>x!==id):[...state.serviceIds,id];
  if(next.length>6)return fail("Можно выбрать до 6 услуг в одной записи");
  const duration=(state.public?.services||[]).filter(x=>next.includes(x.id)).reduce((a,b)=>a+b.minutes,0);
  if(duration>600)return fail("Общая длительность превышает 10 часов. Выберите меньше услуг.");
  state.serviceIds=next;
  state.time="";state.slots=[];state.slotsError="";state.slotsLoading=false;state.slotsRequest++;state.availabilityAlert="";
  render();
  void loadAvailability();
}
function studioToday(){
  const tz=state.public?.timezone||"Europe/Moscow";
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const v=Object.fromEntries(p.map(x=>[x.type,x.value]));
  return v.year+"-"+v.month+"-"+v.day;
}
function visibleDate(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return "";
  const d=new Date(date+"T12:00:00Z");
  return Number.isFinite(d.getTime())?new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"}).format(d):"";
}
function studioMaxDate(){
  const day=new Date(studioToday()+"T00:00:00Z");
  day.setUTCDate(day.getUTCDate()+45);
  return day.toISOString().slice(0,10);
}
function validCalendarDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value)))return false;
  const d=new Date(value+"T00:00:00Z");
  return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value&&value>=studioToday()&&value<=studioMaxDate();
}
function visibleMonth(){
  const initial=studioToday().slice(0,7)+"-01";
  if(!state.calendarMonth||!/^\d{4}-\d{2}-01$/.test(state.calendarMonth))state.calendarMonth=initial;
  if(state.calendarMonth<initial)state.calendarMonth=initial;
  if(state.calendarMonth>studioMaxDate().slice(0,7)+"-01")state.calendarMonth=studioMaxDate().slice(0,7)+"-01";
  return state.calendarMonth;
}
function changeMonth(delta){
  const current=new Date(visibleMonth()+"T00:00:00Z");
  current.setUTCMonth(current.getUTCMonth()+delta);
  const next=current.toISOString().slice(0,7)+"-01";
  if(next<studioToday().slice(0,7)+"-01"||next>studioMaxDate().slice(0,7)+"-01")return;
  state.calendarMonth=next;
  if(rescheduling){renderMoveCalendar();void loadCalendarInfo();}else{render();void loadAvailability();}
}

async function loadCalendarInfo({quiet=false}={}){
  if(isMaster()||state.page!=="booking"&&!rescheduling)return;
  const month=visibleMonth().slice(0,7);
  const ids=rescheduling?rescheduling.serviceIds:state.serviceIds;
  const key=month+"|"+ids.join(",");
  const request=++state.calendarRequest;
  if(!quiet)state.calendarInfo=null;
  try{
    const result=await api("/api/calendar?month="+encodeURIComponent(month)+"&services="+encodeURIComponent(ids.join(",")));
    if(request!==state.calendarRequest)return;
    const days=result.days||{};
    const old=state.calendarInfo;
    const changed=!old||old.key!==key||JSON.stringify(old.days)!==JSON.stringify(days);
    state.calendarInfo={key,days};
    if(changed){
      if(rescheduling)renderMoveCalendar();
      else if(state.page==="booking")render();
    }
  }catch(error){
    if(request===state.calendarRequest)console.warn("BOOKCORE_CALENDAR_STATUS_FAILED",error);
  }
}
function calendarMarkup(mode="booking"){
  const month=visibleMonth();
  const view=new Date(month+"T00:00:00Z");
  const y=view.getUTCFullYear(),m=view.getUTCMonth();
  const offset=(view.getUTCDay()+6)%7;
  const length=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const previous=month>studioToday().slice(0,7)+"-01";
  const next=month<studioMaxDate().slice(0,7)+"-01";
  const title=new Intl.DateTimeFormat("ru-RU",{month:"long",timeZone:"UTC"}).format(view);
  const week=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(w=>'<span class="cal-weekday">'+w+'</span>').join("");
  let days="";
  for(let i=0;i<offset;i++)days+='<span class="cal-empty" aria-hidden="true"></span>';
  for(let day=1;day<=length;day++){
    const date=y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const enabled=validCalendarDate(date);
    const active=(mode==="move"?rescheduling?.date:state.date)===date;
    const today=date===studioToday();
    const calendar=state.calendarInfo;
    const expected=month.slice(0,7)+"|"+(mode==="move"&&rescheduling?rescheduling.serviceIds:state.serviceIds).join(",");
    const item=calendar?.key===expected?calendar.days[date]:null;
    const status=item?.status||"";
    const blocked=status==="off";
    const symbols={off:"×",short:"◐",busy:"•",available:"✓"};
    const valid=enabled&&!blocked;
    days+='<button type="button" class="cal-day'+(status?" state-"+status:"")+(active?" chosen":"")+(today?" today":"")+'"'+
      (valid?' onclick="'+(mode==="move"?"selectMoveDate":"selectDate")+'(\''+date+'\')"':' disabled')+
      ' aria-label="'+esc(date+(item?" — "+item.label:""))+'" title="'+esc(item?.label||"")+'" aria-pressed="'+active+'">'+day+
      (status?'<span aria-hidden="true" class="cal-symbol">'+symbols[status]+'</span>':"")+'</button>';
  }
  return '<div class="book-calendar"><div class="cal-header"><button type="button" class="cal-nav" onclick="changeMonth(-1)"'+(previous?"":" disabled")+' aria-label="Предыдущий месяц">‹</button>'+
    '<b>'+esc(title.charAt(0).toUpperCase()+title.slice(1))+'</b>'+
    '<button type="button" class="cal-nav" onclick="changeMonth(1)"'+(next?"":" disabled")+' aria-label="Следующий месяц">›</button></div>'+
    '<div class="cal-grid">'+week+days+'</div>'+
    '<div class="calendar-legend"><span class="legend-item"><i class="legend-dot available"></i>Свободно</span><span class="legend-item"><i class="legend-dot short"></i>Сокращённый</span><span class="legend-item"><i class="legend-dot busy"></i>Мест нет</span><span class="legend-item"><i class="legend-dot off"></i>Выходной</span></div>'+
    '<div class="cal-caption">Цвета обновляются по расписанию мастера и выбранным услугам. Запись на ближайшие 45 дней.</div></div>';

async function loadTelegramAvatar(){

function bookingCard(b){
  const timezone=state.public?.timezone||"Europe/Moscow";
  const date=new Date(b.starts_at).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",timeZone:timezone});
  const id=String.fromCharCode(39)+String(b.id).replace(/[^a-zA-Z0-9_-]/g,"")+String.fromCharCode(39);
  const isActive=b.status==="confirmed";
  const isCancelled=b.status==="cancelled_by_client";
  const remaining=isCancelled?Math.max(0,Date.parse(b.restore_until||"")-Date.now()):0;
  if(isCancelled&&(!remaining||!b.restore_until)&&!isMaster())return "";
  const isPast=Number.isFinite(Date.parse(b.starts_at))&&Date.parse(b.starts_at)<Date.now();
  const isLocked=!isMaster()&&Date.parse(b.starts_at)-Date.now()<12*3600000;
  const statusLabel=bookingStatusLabel(b.status);
  const badge='<span class="pill" style="background:'+(isActive?"#e6f6e8":"#f2e6eb")+';color:'+(isActive?"#357545":"#7a5668")+'">'+esc(statusLabel)+'</span>';
  const activeActions=isActive&&!isPast?
    (isLocked?'<div class="sub" style="margin-top:11px">До визита осталось менее 12 часов. Для изменения записи свяжитесь с мастером.</div>':
    '<div class="flex" style="margin-top:12px;gap:8px;flex-wrap:wrap"><button class="btn line" onclick="rescheduleForm('+id+','+JSON.stringify(b.service_ids||[b.service_id])+')">📅 Перенести</button><button class="btn line" onclick="cancelBooking('+id+')">Отменить запись</button></div>'):"";
  const restoreAction=isCancelled&&remaining>0&&!isMaster()?
    '<div class="hint" style="margin-top:12px">⏳ Время и очередь сохранены ещё <b class="restore-countdown" data-expiry="'+esc(b.restore_until)+'">'+countdownLabel(remaining)+'</b></div>'+
    '<button class="btn full" style="margin-top:12px" onclick="restoreBooking('+id+')">Вернуть запись на прежнее время →</button>':"";
  const rebookAction=(!isActive&&!isCancelled||isPast)&&!isMaster()?'<button class="btn line full" style="margin-top:12px" onclick="rebookFromHistory('+id+')">Записаться снова →</button>':"";
  const customer=isMaster()?'<div class="sub" style="margin:7px 0">Клиент: '+esc(b.name||"Имя не указано")+'</div>':"";
  return '<div class="card" style="margin-bottom:10px"><div class="row" style="gap:9px;align-items:flex-start"><b style="flex:1;min-width:0">'+esc(b.service_name||"Услуга")+'</b>'+badge+'</div>'+customer+'<div class="sub" style="margin:9px 0">'+esc(date)+'</div><div class="row"><b>'+rub(b.price)+'</b></div>'+activeActions+restoreAction+rebookAction+'</div>';
}
function countdownLabel(ms){return String(Math.floor(ms/60000)).padStart(2,"0")+":"+String(Math.floor((ms%60000)/1000)).padStart(2,"0");}
function updateRestoreCountdowns(){
  if(state.page!=="visits"||isMaster())return;
  const expired=state.bookings.some(b=>b.status==="cancelled_by_client"&&b.restore_until&&Date.parse(b.restore_until)<=Date.now());
  if(expired){state.bookings=state.bookings.filter(b=>b.status!=="cancelled_by_client"||!b.restore_until||Date.parse(b.restore_until)>Date.now());render();return;}
  document.querySelectorAll(".restore-countdown").forEach(element=>{
    const remaining=Math.max(0,Date.parse(element.dataset.expiry)-Date.now());
    element.textContent=countdownLabel(remaining);
  });
}

}

function render(){
  // Normalize initial screen after Telegram role verification.
  // A master must land on the dashboard, not the client home or settings fallback.
  if(isMaster()&&!["overview","calendar","clients","analytics","settings"].includes(state.page))state.page="overview";
  if(!isMaster()&&["overview","calendar","clients","analytics","settings"].includes(state.page))state.page="home";
  nav();
  el("main").innerHTML=isMaster()?masterView():publicView();
}
// One coherent server snapshot for the calendar and the selected day's slots.
async function loadAvailability({quiet=false}={}){
  if(isMaster()||state.page!=="booking"||rescheduling)return;
  if(quiet&&state.availabilityBusy)return;
  const month=visibleMonth().slice(0,7),ids=[...state.serviceIds],date=ids.length?state.date:"";
  const key=month+"|"+ids.join(","),selection=date+"|"+ids.join(",");
  const request=++state.availabilityRequest;
  state.availabilityBusy=true;
  if(!quiet){state.slotsLoading=!!date;state.slotsError="";render();}
  try{
    const params=new URLSearchParams({month,services:ids.join(",")});
    if(date)params.set("date",date);
    const response=await api("/api/availability?"+params.toString());
    if(request!==state.availabilityRequest||state.page!=="booking"||
      visibleMonth().slice(0,7)+"|"+state.serviceIds.join(",")!==key||
      (state.serviceIds.length?state.date:"")+"|"+state.serviceIds.join(",")!==selection)return;
    const oldSlots=state.slots;
    const nextSlots=date?response.slots||[]:[];
    const changed=JSON.stringify(nextSlots)!==JSON.stringify(oldSlots);
    const previousAlert=state.availabilityAlert;
    const taken=!!state.time&&!nextSlots.includes(state.time);
    const previousCalendar=state.calendarInfo;
    const days=response.days||{};
    const calendarChanged=!previousCalendar||previousCalendar.key!==key||
      JSON.stringify(previousCalendar.days)!==JSON.stringify(days);
    state.calendarInfo={key,days};
    state.slots=nextSlots;
    state.slotsError="";
    state.slotsLoading=false;
    state.availabilityUpdatedAt=Date.now();
    if(taken){
      state.time="";
      state.availabilityAlert="Выбранное время занято. Выберите другое окно.";
    }else{
      state.availabilityAlert="";
    }
    if(!quiet||taken){
      // Full rendering is necessary only on explicit selection or when a selected
      // slot was invalidated; keep the user's scroll position intact.
      const position=window.scrollY;
      render();
      if(quiet&&taken)window.scrollTo(0,position);
    }else{
      // Avoid re-creating the whole page every few seconds on mobile Telegram.
      if(changed||previousAlert!==state.availabilityAlert){
        const list=el("slotList");
        if(list)list.innerHTML=slotsMarkup();
      }
      if(calendarChanged){
        const calendar=el("bookingCalendar");
        if(calendar)calendar.innerHTML=calendarMarkup();
      }
    }
  }catch(error){
    if(request!==state.availabilityRequest)return;
    if(!quiet){
      state.slotsError=error.message||"Не удалось обновить расписание.";
      state.slotsLoading=false;
      render();
    }else{
      console.warn("BOOKCORE_AVAILABILITY_REFRESH_FAILED",String(error));
    }
  }finally{
    if(request===state.availabilityRequest){
      state.availabilityBusy=false;
      state.slotsLoading=false;
    }
  }
}
// Legacy helper remains for calls elsewhere in the UI.
async function loadSlots(options){return loadAvailability(options||{});}
async function refreshAvailability(){
  if(document.visibilityState==="hidden"||state.bookingPending||isMaster())return;
  if(state.page==="booking"&&!rescheduling)await loadAvailability({quiet:true});
}
function selectDate(date){
  if(!validCalendarDate(date)||state.calendarInfo?.days?.[date]?.status==="off")return fail("Мастер не работает в выбранный день. Выберите другую дату.");
  state.date=date;state.calendarMonth=date.slice(0,7)+"-01";
  state.time="";state.slots=[];state.slotsError="";state.slotsRequest++;state.availabilityAlert="";
  render();void loadAvailability();
}
function selectTime(time){if(!state.slots.includes(time))return;state.time=time;state.availabilityAlert="";render();}
async function book(){
  if(state.bookingPending||!state.serviceIds.length||!validCalendarDate(state.date)||!state.slots.includes(state.time)){
    return fail("Выберите услуги, доступную дату и свободное время.");
  }
  state.bookingPending=true;render();
  try{
    await api("/api/book",{method:"POST",body:JSON.stringify({serviceIds:state.serviceIds,date:state.date,time:state.time})});
    state.time="";state.slots=[];state.date="";
    fail("Вы успешно записаны!");
    route("visits");
  }catch(error){fail("Не удалось записаться: "+error.message);if(state.date){state.time="";state.availabilityAlert="";void loadAvailability();}}
  finally{state.bookingPending=false;render();}
}
async function loadWaitlist(){
  if(!initial)return;
  try{state.waitlist=(await api("/api/waitlist")).entries||[];if(state.page==="booking")render();}
  catch(e){console.warn("BOOKCORE_WAITLIST_ERROR",e)}
}
async function joinWaitlist(){
  if(!state.date||!state.serviceIds.length)return fail("Выберите услугу и дату.");
  if(!confirm("Сообщить вам в Telegram, если освободится время на выбранную дату?"))return;
  try{
    await api("/api/waitlist",{method:"POST",body:JSON.stringify({date:state.date,serviceIds:state.serviceIds})});
    await loadWaitlist();fail("Вы добавлены в лист ожидания. Бот сообщит, если появится время.");
  }catch(e){fail("Не удалось добавить в лист ожидания: "+e.message)}
}
async function leaveWaitlist(id){
  try{await api("/api/waitlist/remove",{method:"POST",body:JSON.stringify({id})});await loadWaitlist();}
  catch(e){fail("Не удалось убрать из листа ожидания: "+e.message)}
}
async function loadBookings(){try{state.bookings=(await api("/api/bookings")).bookings||[];render()}catch(error){fail("Не удалось загрузить записи: "+error.message)}}
async function cancelBooking(id){
  if(!confirm("Отменить запись? После отмены у вас будет 5 минут, чтобы вернуть её на прежнее время."))return;
  try{
    await api("/api/cancel",{method:"POST",body:JSON.stringify({id})});
    await loadBookings();
    if(isMaster())void loadMaster();
  }catch(e){fail(e.message)}
}

let rescheduling=null;
let moveRequestSequence=0;
function rescheduleForm(id,serviceIds){
  moveRequestSequence++;
  rescheduling={id,serviceIds,date:"",time:""};
  state.calendarMonth=studioToday().slice(0,7)+"-01";
  void loadCalendarInfo();
  el("modalRoot").innerHTML='<div class="overlay" id="moveOverlay" onclick="if(event.target===this)closeMoveModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="Перенос записи">'+
    '<div class="modal-head"><h2>Перенос записи</h2><p class="sub">Выберите новую дату и свободное время.</p></div>'+
    '<div class="modal-scroll" id="moveScroll"><div id="moveCalendar">'+calendarMarkup("move")+'</div><div class="sub" style="margin:12px 0 8px">Доступное время</div><div id="moveSlots" class="flex" style="margin-top:8px"></div></div>'+
    '<div class="modal-actions"><button class="btn line" onclick="closeMoveModal()">Закрыть</button><button class="btn" id="moveSave" disabled onclick="submitMove()">Сохранить перенос</button></div></div></div>';
}
function closeMoveModal(){moveRequestSequence++;rescheduling=null;el("modalRoot").innerHTML="";}
function renderMoveCalendar(){
  const target=el("moveCalendar");if(target&&rescheduling)target.innerHTML=calendarMarkup("move");
}
function selectMoveDate(date){
  if(!rescheduling||!validCalendarDate(date)||state.calendarInfo?.days?.[date]?.status==="off")return;
  rescheduling.date=date;rescheduling.time="";renderMoveCalendar();void loadMoveSlots(date);
}
async function loadMoveSlots(date){
  const current=rescheduling;
  if(!current)return;
  const request=++moveRequestSequence;
  current.date=date;current.time="";current.availableSlots=[];
  const initialSlots=el("moveSlots"),initialSave=el("moveSave");
  if(initialSlots)initialSlots.innerHTML='<p class="sub">Проверяем свободное время…</p>';
  if(initialSave)initialSave.disabled=true;
  const valid=()=>rescheduling===current&&request===moveRequestSequence&&current.date===date;
  try{
    const response=await api("/api/slots?date="+encodeURIComponent(date)+"&services="+encodeURIComponent(current.serviceIds.join(",")));
    if(!valid())return;
    const slotsElement=el("moveSlots"),save=el("moveSave");
    if(!slotsElement||!save)return;
    current.availableSlots=response.slots||[];
    slotsElement.innerHTML=current.availableSlots.map(t=>'<button class="chip" onclick="chooseMoveTime('+String.fromCharCode(39)+t+String.fromCharCode(39)+')">'+t+'</button>').join("")||'<p class="sub">Нет свободных окон</p>';
    save.disabled=true;
    // Show the available times without covering the bottom action bar.
    const container=el("moveScroll");
    if(container&&window.matchMedia("(max-height: 700px)").matches)container.scrollTop=Math.min(container.scrollHeight,container.scrollTop+70);
  }catch(error){
    if(!valid())return;
    const slotsElement=el("moveSlots");
    if(slotsElement)slotsElement.innerHTML='<p class="error">Не удалось загрузить время. Выберите дату ещё раз.</p>';
  }
}
function chooseMoveTime(time){
  if(!rescheduling||!rescheduling.availableSlots?.includes(time))return;
  rescheduling.time=time;
  const save=el("moveSave");if(save)save.disabled=false;
  const slotsElement=el("moveSlots");
  if(slotsElement)Array.from(slotsElement.querySelectorAll(".chip")).forEach(b=>b.classList.toggle("active",b.textContent===time));
}
async function submitMove(){
  if(!rescheduling||!rescheduling.time)return;
  try{await api("/api/reschedule",{method:"POST",body:JSON.stringify({id:rescheduling.id,date:rescheduling.date,time:rescheduling.time})});closeMoveModal();if(isMaster())loadMaster();else loadBookings();}
  catch(e){fail("Не удалось перенести запись: "+e.message);}
}
let masterLoadSequence=0;
async function loadMaster(){
  if(!isMaster())return;
  const sequence=++masterLoadSequence;
  try{
    const result=await api("/api/master");
    if(sequence!==masterLoadSequence)return;
    state.master=result;
  }catch(error){
    if(sequence===masterLoadSequence)fail("Не удалось загрузить кабинет: "+error.message);
  }finally{
    if(sequence===masterLoadSequence){state.loading=false;render();}
  }
}
