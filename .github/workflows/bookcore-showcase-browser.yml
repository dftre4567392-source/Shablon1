name: BOOKCORE Showcase interactive browser test
on:
  workflow_dispatch:
  push:
    paths:
      - 'bookcore-showcase/**'
      - '.github/workflows/bookcore-showcase-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Playwright runtime
        run: npm install --no-save playwright@1.57.0
      - name: Check live BOOKCORE showroom on desktop and mobile
        run: node bookcore-showcase/tests/browser-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookcore-showcase-screenshots
          path: /tmp/showcase-*.png
          if-no-files-found: ignore
