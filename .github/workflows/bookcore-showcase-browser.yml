name: BOOKCORE Showcase interactive browser test
on:
  workflow_dispatch:
  push:
    paths:
      - 'bookcore-showcase/**'
      - '.github/workflows/bookcore-showcase-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Check live BOOKCORE showroom on desktop and mobile
        run: node bookcore-showcase/tests/browser-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookcore-showcase-screenshots
          path: /tmp/showcase-*.png
          if-no-files-found: ignore
