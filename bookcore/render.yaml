services:
  - type: web
    name: bookcore-miniapp
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/dftre4567392-source/Shablon1
    branch: main
    dockerContext: bookcore
    dockerfilePath: bookcore/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookcore-postgres
          property: connectionString
      - key: APP_URL
        value: https://bookcore-miniapp.onrender.com
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: THEME_PRIMARY
        value: "#513548"
      - key: THEME_ACCENT
        value: "#8F5C79"
      - key: THEME_BACKGROUND
        value: "#F8F3F6"
      - key: THEME_SURFACE
        value: "#FFFFFF"
      - key: TENANT_TIMEZONE
        value: Europe/Moscow
      - key: TENANT_DISPLAY_NAME
        value: Студия красоты
      - key: MASTER_DISPLAY_NAME
        value: Ваш мастер
databases:
  - name: bookcore-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: bookcore_postgres
    user: bookcore_postgres_user
